name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom left of the app (for example v2.7.2).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Phone, tablet or watch model and Android / Wear OS version, and how it's connected (USB or Wi‑Fi).
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → About → Open log file. Paste the last lines (remove anything private).
      render: text
