name: Release notes

# Copies each version's section of CHANGELOG.md into its GitHub Release.
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Update release notes
        shell: bash
        run: |
          for v in $(grep -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md); do
            gh release view "v$v" >/dev/null 2>&1 || continue
            .github/notes.sh "$v" > notes.md
            gh release edit "v$v" --title "ADB Connector $v" --notes-file notes.md
            echo "updated v$v"
          done
